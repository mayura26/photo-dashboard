# Live reload for local Go development (`make watch`).
# web/ is served from disk — edit JS/CSS and refresh the browser; no rebuild.

root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
pre_cmd = ["make version"]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = ["./tmp/server"]
include_ext = ["go"]
include_dir = ["cmd", "internal"]
exclude_dir = ["tmp", "bin", "data", "web", "services", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 500
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
